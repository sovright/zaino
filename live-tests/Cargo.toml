[workspace]
members = [
    "zaino-testutils",
    "clientless",
    # Added back as each partition is ported onto the ztest harness:
    "e2e",
]
resolver = "2"

[workspace.package]
authors = ["Zingo Lab Cyan"]
repository = "https://github.com/zingolabs"
homepage = "https://www.zingolabs.org/"
edition = "2021"
license = "Apache-2.0"
version = "0.2.0"

[workspace.dependencies]
# Workspace member.
zaino-testutils = { path = "zaino-testutils" }

# ztest — the k8s-based test harness that owns the validator / indexer / wallet
# lifecycle and hands tests typed RPC handles. Lives in a sibling repo
# (`ZingoLabs/ztest`); requires a sibling checkout for path resolution. The
# tests drive Zaino out-of-process (in a pod) through this, so the live-test
# crates link no zaino/zebra production code — hence no rocksdb / libstdc++.
ztest = { path = "../../ztest" }

# Runtime
tokio = { version = "1.38", features = ["full"] }

# Misc
anyhow = "1.0"
serde_json = "1.0"

# Test parameterization (fetch × state indexer-backend matrix).
rstest = "0.23"

# ztest's librustzcash wallet backend tracks librustzcash `main` (orchard 0.15,
# to match the 6.0.0-rc.0 validator), whose `zcash_client_backend` calls
# shardtree/incrementalmerkletree methods (ensure_retained, retained_checkpoints,
# remove_retained_checkpoint) not yet in the published shardtree 0.6.2. Cargo
# honours `[patch.crates-io]` only from the workspace being built, so ztest's own
# patch is not inherited here — mirror it. Pinned to the same incrementalmerkletree
# rev librustzcash `main` uses; remove once a shardtree release carries these methods.
[patch.crates-io]
shardtree = { git = "https://github.com/zcash/incrementalmerkletree", rev = "decefc469dbf1e686b20b7e7dcaa7cb4f122125b" }
incrementalmerkletree = { git = "https://github.com/zcash/incrementalmerkletree", rev = "decefc469dbf1e686b20b7e7dcaa7cb4f122125b" }
