# Duplicate-code lint exemptions.
#
# The `lint-code-duplication` guard arrived with the upstream sync (upstream
# commit c1eafd9d). Every group below predates it: this is inherited ORAM code
# that the lint had never run against, not duplication introduced by the sync.
#
# Two kinds of entry live here, and they are NOT the same thing:
#
#   PERMANENT - merging these would make the code worse or less safe. In the
#               rostl case, merging would reintroduce a secret-dependent
#               branch. These should stay exempt.
#   TRACKED   - real duplication that should be deduplicated. It is deferred
#               only so the refactor is reviewable separately from a merge
#               commit. Remove the entry when the group is fixed.
#
# The two `tools/` groups that the lint also found were fixed rather than
# exempted: `encoded_byte_len` and `is_gnu_prefix` now live in
# `tools/workbench/src/lib.rs`.
#
# The zainod-oram artifact provenance/publish/validate family (issue #108) was
# deduplicated: the shared envelope/digest/read-back logic for every
# `*ProvenanceV1::new`, `*ProvenanceV1::validate`, `publish_*`, and
# `validate_staged_*` now lives in `packages/zainod-oram/src/corpus_artifact.rs`
# (`new_os_attested_provenance`, `validate_os_attested_provenance`,
# `publish_unwrapped_evidence`, `publish_derived_evidence`,
# `validate_staged_evidence`), and the four `*WorkerTrace::try_from_snapshot`
# copies collapsed into one `WorkerTrace` type in
# `packages/zaino-oram/src/trace.rs`. Two PERMANENT residues remain below
# (773f5a66e163886b, dcb8dbafaaa5787d): the per-report `publish_*` entry
# points, once reduced to a single call into the shared helper, are
# irreducibly identical in shape across types — the only further step would
# be a macro, which CLAUDE.md's DRY section explicitly asks us to avoid in
# favor of a (here, already-adopted) more verbose `fn`-based design.

