[package]
name = "tdx-boot-spike-client"
version = "0.1.0"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rustix = { version = "1.1.4", features = ["fs"] }
rustls = { version = "0.23.41", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tdx-boot-spike-protocol = { version = "0.1.0", path = "../tdx-boot-spike-protocol" }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tonic = { version = "0.14.6", features = ["tls-aws-lc", "transport"] }
zaino-private-client = { version = "0.1.0", path = "../../packages/zaino-private-client" }
