# Standalone dev-tooling crate: its own workspace (not a member of the root one)
# so building a small workbench binary never drags in the production dependency
# graph. `rustix` supplies atomic no-replace filesystem publication without
# unsafe code. One binary per `src/bin/*.rs`; shared logic in `src/lib.rs`.
[package]
name = "workbench"
version = "0.0.0"
edition = "2021"
publish = false

# Own workspace root -> isolated resolution, independent of the production tree.
[workspace]

# Crate-wide: forbid unsafe across the lib and every binary in one place.
[lints.rust]
unsafe_code = "forbid"

[dependencies]
rustix = { version = "1.1.4", features = ["fs"] }
dupes-core = "=0.2.1"
dupes-rust = "=0.2.1"
