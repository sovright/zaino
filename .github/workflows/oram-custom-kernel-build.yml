name: ORAM custom kernel build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/oram-custom-kernel-build.yml'
      - 'deploy/tdx/accepted-guest-spike/**'

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        run: [run-1, run-2]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Resolve authenticated builder tool closure
        run: |
          spike=deploy/tdx/accepted-guest-spike
          bash "$spike/resolve-package-closure.sh" "$RUNNER_TEMP/tool-closure" "$spike/custom-kernel-tool-roots.json"
          bash "$spike/verify-package-closure.sh" "$RUNNER_TEMP/tool-closure" "$spike/custom-kernel-tool-roots.json"
      - name: Download authenticated source archives
        run: |
          spike=deploy/tdx/accepted-guest-spike
          bash "$spike/download-custom-kernel-source.sh" "$RUNNER_TEMP/kernel-source"
      - name: Build without container network
        run: |
          spike=deploy/tdx/accepted-guest-spike
          bash "$spike/build-custom-kernel-once.sh" \
            "$RUNNER_TEMP/kernel-source" "$RUNNER_TEMP/tool-closure" \
            "$spike/custom-kernel.config" '${{ matrix.run }}' "$RUNNER_TEMP/kernel-build"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custom-kernel-${{ matrix.run }}
          path: ${{ runner.temp }}/kernel-build
          if-no-files-found: error
          retention-days: 7
      - name: Retain rejected effective configuration
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: custom-kernel-${{ matrix.run }}-failure
          path: ${{ runner.temp }}/kernel-build.failure
          if-no-files-found: warn
          retention-days: 7

  compare:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: custom-kernel-run-1
          path: ${{ runner.temp }}/run-1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: custom-kernel-run-2
          path: ${{ runner.temp }}/run-2
      - name: Compare independently built outputs and provenance
        run: |
          (cd "$RUNNER_TEMP/run-1/artifacts" && sha256sum --check SHA256SUMS)
          (cd "$RUNNER_TEMP/run-2/artifacts" && sha256sum --check SHA256SUMS)
          cmp "$RUNNER_TEMP/run-1/artifacts/SHA256SUMS" "$RUNNER_TEMP/run-2/artifacts/SHA256SUMS"
          cmp "$RUNNER_TEMP/run-1/tool-versions.txt" "$RUNNER_TEMP/run-2/tool-versions.txt"
          jq -S 'del(.run_label)' "$RUNNER_TEMP/run-1/build-run.json" > "$RUNNER_TEMP/run-1.json"
          jq -S 'del(.run_label)' "$RUNNER_TEMP/run-2/build-run.json" > "$RUNNER_TEMP/run-2.json"
          cmp "$RUNNER_TEMP/run-1.json" "$RUNNER_TEMP/run-2.json"
          echo 'Two clean GitHub runners produced identical kernel artifact digests.'
