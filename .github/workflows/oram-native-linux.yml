name: ORAM - Native Linux

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oram-native-linux.yml'
      - '.config/nextest.toml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'packages/zaino-common/**'
      - 'packages/zaino-fetch/**'
      - 'packages/zaino-oram/**'
      - 'packages/zaino-proto/**'
      - 'packages/zaino-state/**'
      - 'packages/zainod-oram/**'
      - 'rust-toolchain.toml'
      - 'tools/workbench/**'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/oram-native-linux.yml'
      - '.config/nextest.toml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'packages/zaino-common/**'
      - 'packages/zaino-fetch/**'
      - 'packages/zaino-oram/**'
      - 'packages/zaino-proto/**'
      - 'packages/zaino-state/**'
      - 'packages/zainod-oram/**'
      - 'rust-toolchain.toml'
      - 'tools/workbench/**'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  zaino-oram:
    name: zaino-oram (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Verify native architecture and pinned toolchain
        run: |
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          uname -a
          rustup show active-toolchain
          rustc --version --verbose

      - name: Install cargo-nextest
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: nextest@0.9.140
          fallback: none

      - name: Verify test runner
        run: cargo nextest --version

      - name: Run strict all-feature Clippy
        run: >-
          cargo clippy -p zaino-oram --all-features --all-targets --no-deps
          --locked --
          -D warnings -D clippy::unwrap_used

      - name: Run all-feature tests natively
        run: >-
          cargo nextest run -p zaino-oram --all-features --locked
          --no-tests fail --status-level fail

      - name: Run strict typed-qualification runner Clippy
        run: >-
          cargo clippy -p zainod-oram --all-features --all-targets --no-deps
          --locked --
          -D warnings -D clippy::unwrap_used

      - name: Run typed-qualification runner tests natively
        run: >-
          cargo nextest run -p zainod-oram --all-features --locked
          --no-tests fail --status-level fail

      # Phase 0 kill-gate 2: the ORAM insertion path must keep matching the
      # reviewed structural codegen profile. This is a fail-closed regression
      # check over the release binary, not semantic taint analysis.
      - name: Build the typed-qualification runner for codegen inspection
        run: cargo build -p zainod-oram --all-features --locked --release

      - name: Verify binutils are available
        run: |
          nm --version | head -1
          objdump --version | head -1

      - name: Check the ORAM access-path codegen profile
        run: >-
          cargo run --locked --release
          --manifest-path tools/workbench/Cargo.toml
          --bin check-oram-codegen -- target/release/zainod-oram

      - name: Check the ORAM exact-upsert codegen profile
        run: >-
          cargo run --locked --release
          --manifest-path tools/workbench/Cargo.toml
          --bin check-oram-codegen --
          --profile fixed-exact-upsert target/release/zainod-oram

      # TEMPORARY -- remove before this branch merges. Emits the candidate
      # profiles and the raw disassembly so the 448-byte growth in
      # `fixed_add_page_append` can get the manual assembly review ADR 0901
      # requires before any profile is admitted. Runs before the check step so
      # it still produces artifacts on a run the check then fails.
      # Raw evidence FIRST, and in its own step. The emit below is gated -- it
      # refuses on a size mismatch or an unrecognised mnemonic -- so running it
      # ahead of the disassembly would let a gate suppress the very evidence
      # needed to judge that gate. That is the trap this ordering avoids.
      - name: Disassemble the guarded page symbols
        run: |
          mkdir -p /tmp/pin-review
          nm -nSC --defined-only target/release/zainod-oram \
            | grep -E 'fixed_(base|add|spend)_page_append' | tee /tmp/pin-review/sizes.txt
          objdump -d --no-show-raw-insn -C target/release/zainod-oram \
            > /tmp/pin-review/zainod-oram.full.asm
          for sym in fixed_base_page_append fixed_add_page_append fixed_spend_page_append; do
            awk -v s="$sym" '$0 ~ s"[^ ]*>:" {p=1} p && /^$/ {exit} p' \
              /tmp/pin-review/zainod-oram.full.asm > "/tmp/pin-review/$sym.raw.asm"
            echo "== $sym: $(wc -l < "/tmp/pin-review/$sym.raw.asm") lines, \
          $(grep -cE '^\s+[0-9a-f]+:\s+j' "/tmp/pin-review/$sym.raw.asm") branch(es)"
          done
          rm /tmp/pin-review/zainod-oram.full.asm

      - name: Emit candidate page profiles for review
        continue-on-error: true
        run: |
          mkdir -p /tmp/pin-review/candidate
          cargo run --locked --release \
            --manifest-path tools/workbench/Cargo.toml \
            --bin check-oram-page-codegen -- \
            --emit-profiles target/release/zainod-oram /tmp/pin-review/candidate

      - name: Upload candidate profiles for review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: page-pin-review
          path: /tmp/pin-review/

      - name: Check the fixed-page transform codegen profile
        run: >-
          cargo run --locked --release
          --manifest-path tools/workbench/Cargo.toml
          --bin check-oram-page-codegen --
          target/release/zainod-oram
