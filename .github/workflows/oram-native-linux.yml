name: ORAM - Native Linux

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oram-native-linux.yml'
      - '.config/nextest.toml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'packages/zaino-common/**'
      - 'packages/zaino-fetch/**'
      - 'packages/zaino-oram/**'
      - 'packages/zaino-private-client/**'
      - 'packages/zaino-tdx-evidence/**'
      - 'tools/tdx-boot-spike-client/**'
      - 'tools/tdx-boot-spike-protocol/**'
      - 'tools/tdx-evidence-agent/**'
      - 'packages/zaino-proto/**'
      - 'packages/zaino-state/**'
      - 'packages/zainod-oram/**'
      - 'rust-toolchain.toml'
      - 'tools/workbench/**'
      - 'tools/scripts/package-oram-build.sh'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/oram-native-linux.yml'
      - '.config/nextest.toml'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'packages/zaino-common/**'
      - 'packages/zaino-fetch/**'
      - 'packages/zaino-oram/**'
      - 'packages/zaino-private-client/**'
      - 'packages/zaino-tdx-evidence/**'
      - 'tools/tdx-boot-spike-client/**'
      - 'tools/tdx-boot-spike-protocol/**'
      - 'tools/tdx-evidence-agent/**'
      - 'packages/zaino-proto/**'
      - 'packages/zaino-state/**'
      - 'packages/zainod-oram/**'
      - 'rust-toolchain.toml'
      - 'tools/workbench/**'
      - 'tools/scripts/package-oram-build.sh'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  private-client:
    name: Private client (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    # The production codec currently pulls in the chain-index native dependency
    # closure; cold Clippy plus test builds need the same budget as the runner.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Verify pinned toolchain
        run: |
          rustup show active-toolchain
          rustc --version --verbose
      - name: Install cargo-nextest
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: nextest@0.9.140
          fallback: none
      - name: Check client and boot diagnostic components
        run: >-
          cargo clippy -p zaino-private-client -p zaino-tdx-evidence
          -p tdx-boot-spike-protocol -p tdx-evidence-agent -p tdx-boot-spike-client
          --all-targets --no-deps --locked --
          -D warnings -D clippy::unwrap_used
      - name: Test client and boot diagnostic components
        run: >-
          cargo nextest run -p zaino-private-client -p zaino-tdx-evidence
          -p tdx-boot-spike-protocol -p tdx-evidence-agent -p tdx-boot-spike-client --locked
          --no-tests fail --status-level fail

  zaino-oram:
    name: zaino-oram (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ORAM_LIVE_REFRESH_TEST: inner_codec::private_service::tests::mainnet_runtime_refreshes_from_a_live_nonempty_recent_snapshot

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Verify native architecture and pinned toolchain
        run: |
          test "$(uname -s)" = "Linux"
          test "$(uname -m)" = "x86_64"
          uname -a
          rustup show active-toolchain
          rustc --version --verbose

      - name: Install cargo-nextest
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: nextest@0.9.140
          fallback: none

      - name: Verify test runner
        run: cargo nextest --version

      - name: Run strict all-feature Clippy
        run: >-
          cargo clippy -p zaino-oram --all-features --all-targets --no-deps
          --locked --
          -D warnings -D clippy::unwrap_used

      - name: Verify exactly one live-refresh regression is selected
        run: |
          cargo nextest list -p zaino-oram --all-features --locked \
            -E "test(=$ORAM_LIVE_REFRESH_TEST)" --message-format json \
            > target/oram-live-refresh-tests.json
          jq -e --arg expected "$ORAM_LIVE_REFRESH_TEST" '
            [."rust-suites"[].testcases | to_entries[] |
              select(.value."filter-match".status == "matches" and .value.ignored == false) |
              .key] == [$expected]
          ' target/oram-live-refresh-tests.json

      - name: Run live-refresh regression before the remaining suite
        run: >-
          cargo nextest run -p zaino-oram --all-features --locked
          -E "test(=$ORAM_LIVE_REFRESH_TEST)"
          --no-tests fail --status-level fail

      - name: Run remaining all-feature tests natively
        run: >-
          cargo nextest run -p zaino-oram --all-features --locked
          -E "not test(=$ORAM_LIVE_REFRESH_TEST)"
          --no-tests fail --status-level fail

      - name: Run strict typed-qualification runner Clippy
        run: >-
          cargo clippy -p zainod-oram --all-features --all-targets --no-deps
          --locked --
          -D warnings -D clippy::unwrap_used

      - name: Run typed-qualification runner tests natively
        run: >-
          cargo nextest run -p zainod-oram --all-features --locked
          --no-tests fail --status-level fail

      # Phase 0 kill-gate 2: the ORAM insertion path must keep matching the
      # reviewed structural codegen profile. This is a fail-closed regression
      # check over the release binary, not semantic taint analysis.
      - name: Build the typed-qualification runner for codegen inspection
        run: cargo build -p zainod-oram --all-features --locked --release

      - name: Verify binutils are available
        run: |
          nm --version | head -1
          objdump --version | head -1

      - name: Check the ORAM access-path codegen profile
        run: >-
          cargo run --locked --release
          --manifest-path tools/workbench/Cargo.toml
          --bin check-oram-codegen -- target/release/zainod-oram

      - name: Check the ORAM exact-upsert codegen profile
        run: >-
          cargo run --locked --release
          --manifest-path tools/workbench/Cargo.toml
          --bin check-oram-codegen --
          --profile fixed-exact-upsert target/release/zainod-oram

      - name: Check the fixed-page transform codegen profile
        run: >-
          cargo run --locked --release
          --manifest-path tools/workbench/Cargo.toml
          --bin check-oram-page-codegen --
          target/release/zainod-oram

      - name: Package the checked research runner and build identity
        run: bash tools/scripts/package-oram-build.sh target/oram-native-build

      - name: Retain the checked native research runner
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oram-native-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: target/oram-native-build/
          if-no-files-found: error
          retention-days: 30
