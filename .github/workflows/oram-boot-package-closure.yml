name: ORAM - Boot Package Closure

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/oram-boot-package-closure.yml'
      - 'deploy/tdx/accepted-guest-spike/**'

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve signed snapshot closure
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false
      - name: Verify retained roots and static policy
        run: |
          set -euo pipefail
          spike=deploy/tdx/accepted-guest-spike
          bash "$spike/test-upstream-selection.sh"
          bash "$spike/test-package-roots.sh"
          bash "$spike/test-kernel-config.sh"
      - name: Resolve twice from isolated state
        run: |
          set -euo pipefail
          spike=deploy/tdx/accepted-guest-spike
          bash "$spike/resolve-package-closure.sh" "$RUNNER_TEMP/closure-a"
          bash "$spike/resolve-package-closure.sh" "$RUNNER_TEMP/closure-b"
          bash "$spike/verify-package-closure.sh" "$RUNNER_TEMP/closure-a"
          bash "$spike/verify-package-closure.sh" "$RUNNER_TEMP/closure-b"
          bash "$spike/test-package-closure.sh" "$RUNNER_TEMP/closure-a"
          jq -S . "$RUNNER_TEMP/closure-a/package-lock.json" > "$RUNNER_TEMP/lock-a.json"
          jq -S . "$RUNNER_TEMP/closure-b/package-lock.json" > "$RUNNER_TEMP/lock-b.json"
          cmp "$RUNNER_TEMP/lock-a.json" "$RUNNER_TEMP/lock-b.json"
      - name: Confirm stock kernel policy refusal
        run: |
          set -euo pipefail
          spike=deploy/tdx/accepted-guest-spike
          kernel=$(jq -r '.packages[] | select(.name == "linux-modules-6.17.0-1012-gcp") | .filename | split("/")[-1]' "$RUNNER_TEMP/closure-a/package-lock.json")
          test -n "$kernel"
          mkdir "$RUNNER_TEMP/kernel"
          dpkg-deb --extract "$RUNNER_TEMP/closure-a/packages/$kernel" "$RUNNER_TEMP/kernel"
          config="$RUNNER_TEMP/kernel/boot/config-6.17.0-1012-gcp"
          if bash "$spike/verify-kernel-config.sh" "$config" > "$RUNNER_TEMP/kernel-policy.log" 2>&1; then
            echo 'stock kernel unexpectedly passed the no-admin policy' >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/kernel-policy.log"
          grep -Fq 'prohibited setting enabled: CONFIG_DEBUG_FS' "$RUNNER_TEMP/kernel-policy.log"
      - name: Retain canonical negative-decision inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boot-package-closure-locks
          path: |
            ${{ runner.temp }}/closure-a/package-lock.json
            ${{ runner.temp }}/closure-b/package-lock.json
            ${{ runner.temp }}/kernel-policy.log
          if-no-files-found: error
          retention-days: 14
