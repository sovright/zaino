name: ORAM offline workload build
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/oram-offline-workload-build.yml'
      - 'deploy/tdx/accepted-guest-spike/**'
      - 'tools/tdx-evidence-agent/**'
      - 'tools/tdx-boot-spike-protocol/**'
      - 'packages/zaino-tdx-evidence/**'
      - 'Cargo.lock'
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix: {run: [run-1, run-2]}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with: {persist-credentials: false, fetch-depth: 0}
      - name: Resolve authenticated workload tool closure
        run: |
          s=deploy/tdx/accepted-guest-spike
          bash "$s/resolve-package-closure.sh" "$RUNNER_TEMP/tools" "$s/workload-tool-roots.json"
      - name: Download and verify pinned Rust archives
        run: |
          s=deploy/tdx/accepted-guest-spike; mkdir "$RUNNER_TEMP/rust"
          jq -r '.components[] | [.url,.file] | @tsv' "$s/rust-toolchain-inputs.json" | while IFS=$'\t' read -r url file; do curl --fail --location --proto '=https' --tlsv1.2 --connect-timeout 20 --max-time 600 --max-filesize 268435456 --output "$RUNNER_TEMP/rust/$file" "$url"; done
          bash "$s/verify-rust-toolchain-inputs.sh" "$RUNNER_TEMP/rust"
      - name: Freeze Cargo source inputs
        run: bash deploy/tdx/accepted-guest-spike/prepare-workload-source.sh "$RUNNER_TEMP/source"
      - name: Build with no container network
        run: bash deploy/tdx/accepted-guest-spike/build-workload-once.sh "$RUNNER_TEMP/source" "$RUNNER_TEMP/tools" "$RUNNER_TEMP/rust" '${{ matrix.run }}' "$RUNNER_TEMP/output"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: 'offline-workload-${{ matrix.run }}', path: '${{ runner.temp }}/output', if-no-files-found: error, retention-days: 7}
  compare:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with: {persist-credentials: false}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: offline-workload-run-1, path: '${{ runner.temp }}/run-1'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {name: offline-workload-run-2, path: '${{ runner.temp }}/run-2'}
      - name: Compare independent outputs
        run: |
          bash deploy/tdx/accepted-guest-spike/compare-workload-outputs.sh "$RUNNER_TEMP/run-1" "$RUNNER_TEMP/run-2"
