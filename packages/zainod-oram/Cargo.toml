[package]
name = "zainod-oram"
description = "Non-published one-shot tools for Zaino ORAM research."
version = "0.1.0"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "zainod-oram-timing"
path = "src/bin/zainod-oram-timing.rs"
required-features = ["typed-qualification"]

[features]
default = []
private-service = [
    "dep:http-body",
    "dep:prost",
    "dep:tonic",
    "dep:tonic-prost",
    "dep:tonic-prost-build",
]
typed-qualification = ["zaino-oram/rostl-experimental"]

[dependencies]
blake2.workspace = true
clap = { workspace = true, features = ["derive"] }
futures.workspace = true
hex.workspace = true
http-body = { version = "1", optional = true }
prost = { workspace = true, optional = true }
rustix = { version = "1.1.4", features = ["fs"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
tar = { version = "0.4.46", default-features = false }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
tonic = { workspace = true, optional = true }
tonic-prost = { version = "0.14", optional = true }
zaino-common = { version = "0.2.0", path = "../zaino-common" }
zaino-oram = { version = "0.1.0", path = "../zaino-oram", features = ["corpus-zaino"] }
zaino-state = { version = "0.3.1", path = "../zaino-state", default-features = false }
zainod = { version = "0.4.3-ironwood.1", path = "../zainod" }

[build-dependencies]
tonic-prost-build = { version = "0.14", optional = true }
