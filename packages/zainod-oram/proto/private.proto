syntax = "proto3";

package zaino.private.v1;

// One fixed-size protected application envelope.
message FixedEnvelope {
  bytes envelope = 1;
  // The key epoch this envelope was sealed under. Cleartext on purpose: it is
  // per-generation and identical for every client, so it reveals nothing, and
  // sealing it inside would make a retired key indistinguishable from any
  // other refusal — leaving a wallet no way to learn it must re-bootstrap.
  uint64 key_epoch = 2;
}

// Empty: bootstrap takes no client input. A field here would be an input to
// authenticate before the client holds any key material, which is exactly the
// surface this design avoids.
message BootstrapRequest {}

// Everything a wallet needs to seal a query, and nothing else.
message BootstrapResponse {
  // Identifies the key generation these keys belong to. Sent back in cleartext
  // on every QueryPage so a retired key is actionable rather than opaque.
  uint64 key_epoch = 1;
  // Seals request envelopes.
  bytes request_key = 2;
  // Opens response envelopes.
  bytes response_key = 3;
  // Human-readable name of the compiled privacy profile, for logs and support.
  //
  // Diagnostic, NOT authoritative: do not pin on it. The authoritative profile
  // identifier is a digest over every logical budget dimension and is already
  // bound into protected request state, so a query sealed against the wrong
  // profile fails to open regardless of what this string says. It is named
  // `profile_label` rather than `profile_id` precisely so it cannot be mistaken
  // for that identifier.
  string profile_label = 4;
  // Exact envelope size class, so a wallet pads correctly without guessing.
  uint32 envelope_bytes = 5;
  // Legacy reserved field, always empty. Fresh raw evidence is obtained from
  // GetEvidence before bootstrap; an empty field is never attestation success.
  bytes attestation = 6;
  // Authoritative identifier of the compiled privacy profile: a digest over
  // every logical budget dimension the runtime compiles in.
  //
  // A wallet needs it to build the envelope protection context it seals a
  // request under. The same bytes are bound into protected request state on
  // the server side, so a request sealed under a different profile identifier
  // does not open — which is also why publishing it costs nothing: the digest
  // covers only compiled, deployment-wide parameters, carries no key material,
  // and is identical for every client this runtime serves.
  //
  // Unlike `profile_label`, this field IS authoritative. Pin on it.
  bytes profile_id = 7;
  // Versioned, complete codec context below. Version zero means absent legacy context.
  uint32 context_version = 8;
  // Random per-security-lease binding authenticated inside every envelope.
  bytes session_binding = 9;
  PrivateNetwork network = 10;
  // Exact finalized checkpoint from the pinned recent serving identity.
  uint32 serving_finalized_checkpoint_height = 11;
  // Display-order bytes, matching the protected query codec representation.
  bytes serving_finalized_checkpoint_block_hash_display = 12;
  uint32 schema_version = 13;
  uint64 projection_epoch = 14;
}

enum PrivateNetwork {
  PRIVATE_NETWORK_UNSPECIFIED = 0;
  PRIVATE_NETWORK_MAINNET = 1;
  PRIVATE_NETWORK_TESTNET = 2;
  PRIVATE_NETWORK_REGTEST = 3;
}

// The verifier contributes only a fresh, exactly 64-byte challenge.
message EvidenceRequest {
  bytes challenge = 1;
}

// Unverified raw evidence. The client must validate the quote and its policy,
// recompute REPORT_DATA, and match the actual TLS peer's SPKI before bootstrap.
// These public claims are not trusted merely because the server returned them.
message EvidenceResponse {
  uint32 transcript_version = 1;
  bytes challenge = 2;
  bytes tls_spki_sha256 = 3;
  bytes binary_sha256 = 4;
  bytes effective_config_sha256 = 5;
  bytes profile_id = 6;
  uint32 schema_version = 7;
  uint64 key_epoch = 8;
  uint32 checkpoint_height = 9;
  // Internal canonical block-hash bytes, not reversed display-order hex.
  // This identifies the public chain checkpoint, not an authenticated ORAM root.
  bytes checkpoint_block_hash = 10;
  bytes raw_quote = 11;
}

// Independent private-query surface. This is not the legacy lightwallet API.
service PrivateCompactTxStreamer {
  rpc QueryPage(FixedEnvelope) returns (FixedEnvelope);
  rpc BootstrapSession(BootstrapRequest) returns (BootstrapResponse);
  rpc GetEvidence(EvidenceRequest) returns (EvidenceResponse);
}
