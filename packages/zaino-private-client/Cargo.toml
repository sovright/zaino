[package]
name = "zaino-private-client"
version = "0.1.0"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
hex = "0.4"
http = "1.1"
hyper-util = { version = "0.1.20", features = ["tokio"] }
prost = "0.14"
rustix = { version = "1.1.4", features = ["fs"] }
rustls = { version = "0.23.41", default-features = false, features = ["aws_lc_rs", "prefer-post-quantum"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.2"
tokio = { workspace = true, features = ["net", "time", "sync", "rt", "macros"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws_lc_rs"] }
tonic = { version = "0.14.6", features = ["transport"] }
tonic-prost = "0.14.6"
tower = { version = "0.4", features = ["util"] }
x509-parser = { version = "0.18.1", default-features = false }
zaino-oram = { version = "0.1.0", path = "../zaino-oram", default-features = false, features = ["client-codec"] }

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14"

[dev-dependencies]
rcgen = { version = "0.14.9", default-features = false, features = ["aws_lc_rs"] }
