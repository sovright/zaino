[package]
name = "zaino-oram"
description = "Research models for Zaino's proposed oblivious private-query projection."
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
version = "0.1.0"
publish = false

[features]
default = []
corpus-zaino = ["dep:zaino-state"]
rostl-experimental = [
    "dep:bytemuck",
    "dep:rand",
    "dep:rostl-oram",
    "dep:rostl-primitives",
]

[dependencies]
bytemuck = { version = "1.25.1", features = ["derive", "min_const_generics"], optional = true }
rand = { version = "0.9.4", optional = true }
rostl-oram = { git = "https://github.com/obliviouslabs/rostl", rev = "8c3a12d2febf17b024f2e949428b3bc526d74172", version = "0.1.0-alpha9", optional = true }
rostl-primitives = { git = "https://github.com/obliviouslabs/rostl", rev = "8c3a12d2febf17b024f2e949428b3bc526d74172", version = "0.1.0-alpha9", optional = true }
zaino-state = { version = "0.3.1", path = "../zaino-state", default-features = false, optional = true }
